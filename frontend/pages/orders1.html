<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management - SaiKrupa Paithani</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#800000",
                        primaryLight: "#b30000",
                        gold: "#D4AF37",
                        lightGold: "#F2E8C9",
                        cream: "#F8F4E3",
                        darkRed: "#680000",
                    }
                }
            }
        }
    </script>
    <style>
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending {
            background-color: #fef3c7;
            color: #92400e;
        }

        .status-delivered {
            background-color: #d1fae5;
            color: #065f46;
        }

        .status-shipped {
            background-color: #e0e7ff;
            color: #3730a3;
        }

        .status-cancelled {
            background-color: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>

<body class="bg-gray-50">
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="flex items-center justify-between p-4 px-8">
            <div class="flex items-center">
                <a href="admin1.html" class="p-2 rounded-lg hover:bg-gray-100 mr-4">
                    <i class="fas fa-arrow-left text-gray-600"></i>
                </a>
                <h2 class="text-xl font-bold text-gray-800">Order Management</h2>
            </div>
            <div class="flex items-center space-x-4">
                <span id="adminNameDisplay" class="text-sm font-medium text-gray-700">Admin</span>
                <img src="https://ui-avatars.com/api/?name=Admin&background=800000&color=fff"
                    class="w-8 h-8 rounded-full">
            </div>
        </div>
    </header>

    <main class="p-8">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-primary">
                <p class="text-gray-500 text-sm">Total Orders</p>
                <h3 class="text-2xl font-bold" id="totalOrders">0</h3>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-yellow-500">
                <p class="text-gray-500 text-sm">Pending</p>
                <h3 class="text-2xl font-bold" id="pendingOrders">0</h3>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500">
                <p class="text-gray-500 text-sm">Shipped</p>
                <h3 class="text-2xl font-bold" id="shippedOrders">0</h3>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500">
                <p class="text-gray-500 text-sm">Delivered</p>
                <h3 class="text-2xl font-bold" id="deliveredOrders">0</h3>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200">
            <div class="p-6 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-lg font-bold">Recent Orders</h3>
                <div class="flex gap-2">
                    <input type="text" id="orderSearch" placeholder="Search orders..."
                        class="border rounded-lg px-4 py-2 text-sm focus:ring-primary focus:border-primary">
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase">Order ID</th>
                            <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase">Customer</th>
                            <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase">Total</th>
                            <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase">Status</th>
                            <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase">Date</th>
                            <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody" class="divide-y divide-gray-100">
                        <!-- Orders will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script>
        const adminToken = localStorage.getItem('adminToken');
        const adminData = localStorage.getItem('admin');

        async function checkAuth() {
            if (!adminToken) {
                window.location.href = 'admin-login.html';
                return;
            }
            if (adminData) {
                const admin = JSON.parse(adminData);
                document.getElementById('adminNameDisplay').textContent = admin.name;
            }
            loadOrders();
        }

        async function loadOrders() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/orders/all-orders`, {
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });

                if (res.status === 401) {
                    console.error("Unauthorized. Redirecting to login.");
                    localStorage.removeItem('adminToken');
                    window.location.href = 'admin-login.html';
                    return;
                }

                const data = await res.json();
                if (data.success) {
                    renderOrders(data.orders);
                    updateStats(data.orders);
                }
            } catch (err) {
                console.error("Failed to load orders:", err);
            }
        }

        function renderOrders(orders) {
            const tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = orders.map(o => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 font-medium">#${o.orderNumber || o._id.slice(-6)}</td>
                    <td class="px-6 py-4">${o.userId?.name || 'Guest'}</td>
                    <td class="px-6 py-4 font-bold">₹${o.orderSummary.total}</td>
                    <td class="px-6 py-4">
                        <span class="status-badge status-${o.status}">${o.status}</span>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-500">${new Date(o.createdAt).toLocaleDateString()}</td>
                    <td class="px-6 py-4">
                        <button class="text-primary hover:text-primaryLight font-medium" onclick="viewOrder('${o._id}')">View</button>
                    </td>
                </tr>
            `).join('');
        }

        function updateStats(orders) {
            document.getElementById('totalOrders').textContent = orders.length;
            document.getElementById('pendingOrders').textContent = orders.filter(o => o.status === 'pending').length;
            document.getElementById('shippedOrders').textContent = orders.filter(o => o.status === 'shipped').length;
            document.getElementById('deliveredOrders').textContent = orders.filter(o => o.status === 'delivered').length;
        }

        function viewOrder(id) {
            // Simplified for now
            console.log("Viewing order:", id);
        }

        checkAuth();
    </script>
</body>

</html>
